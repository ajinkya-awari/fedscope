[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "fedscope"
version = "0.1.0"
description = "Reproducible federated-learning benchmark on PathMNIST (size 28)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
]

[project.optional-dependencies]
# Offline contract tests (no PathMNIST, no Flower, no GPU)
dev = [
    "torchvision>=0.15",
    "streamlit>=1.28",
    "pytest>=7.4",
]
# Kaggle runtime (install inside an authenticated Kaggle session only)
kaggle = [
    "flwr[simulation]==1.20.0",
    "medmnist==3.0.2",
    "matplotlib>=3.7,<4",
    "torchvision>=0.15",
]

[tool.setuptools.packages.find]
include = ["fedscope*", "study*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
